name: Publish Mods

# Publishes packages from the Unity Mod Packager (MistEra_Mods folder on the self-hosted runner) to the rolling
# "mods" release. Catalogs are compared independently, including metadata-only changes.
# Plan: Docs/Mods/Plan_ModPackaging.md

on:
  push:
    tags:
      - '*'
      - '!mods'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mods-publish
  cancel-in-progress: false

jobs:
  publish_mods:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate packages without publishing
        shell: pwsh
        run: ./ci/publish_mods.ps1 -ValidateOnly
        env:
          MODS_DIR: ${{ vars.MODS_DIR || 'E:\UnityProjects\MistEra_Mods' }}

      - name: Publish changed packages and catalogs
        shell: pwsh
        run: ./ci/publish_mods.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODS_DIR: ${{ vars.MODS_DIR || 'E:\UnityProjects\MistEra_Mods' }}
