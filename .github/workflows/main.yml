name: Release

on:
  push:
    tags:
      - '*'
      - '!mods'   # rolling mod release tag (mods.yml), never a game build

permissions:
  contents: write

jobs:
  build_and_package:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip the build directory
        # leaves out Save/ and Mods/ (except Mods/Assetpacks/Image_Generation_Config.json)
        shell: pwsh
        run: ./ci/zip_demo.ps1 "${{ secrets.BUILD_DIR }}" "MistEra-${{ github.ref_name }}.7z" "${{ secrets.ZIP_PASSWORD }}"

      - name: Create GitHub Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MistEra ${{ github.ref_name }}
          files: MistEra-${{ github.ref_name }}.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
